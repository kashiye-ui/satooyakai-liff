<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>令和8年度 夏休みファミリー旅行 しおり｜さいたま市里親会</title>
  <style>
    :root { --bar: #06c755; --bg: #111; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
    body {
      font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      color: #fff; overflow: hidden;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px);
      padding-top: env(safe-area-inset-top);
    }
    header .ttl { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header .count { font-size: 0.85rem; font-variant-numeric: tabular-nums; opacity: 0.9; flex: 0 0 auto; margin-left: 10px; }

    /* 横スワイプでページ送り */
    .deck {
      display: flex; height: 100%; width: 100%;
      overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .deck::-webkit-scrollbar { display: none; }
    .slide {
      flex: 0 0 100%; width: 100%; height: 100%;
      scroll-snap-align: center; scroll-snap-stop: always;
      display: flex; align-items: center; justify-content: center;
      padding: 52px 8px calc(16px + env(safe-area-inset-bottom));
    }
    .slide img {
      max-width: 100%; max-height: 100%; object-fit: contain;
      border-radius: 4px; background: #fff;
      box-shadow: 0 2px 16px rgba(0,0,0,0.5); cursor: zoom-in;
    }

    .hint {
      position: fixed; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom));
      text-align: center; font-size: 0.78rem; color: rgba(255,255,255,0.85);
      pointer-events: none; transition: opacity .4s; z-index: 9;
    }

    /* ピンチ拡大できる全画面オーバーレイ */
    .zoom {
      position: fixed; inset: 0; z-index: 50; background: #000;
      display: none; overflow: auto; -webkit-overflow-scrolling: touch;
      touch-action: pinch-zoom;
    }
    .zoom.open { display: block; }
    .zoom img { display: block; width: 100%; height: auto; cursor: zoom-out; }
    .zoom .close {
      position: fixed; top: calc(8px + env(safe-area-inset-top)); right: 12px; z-index: 51;
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: rgba(0,0,0,0.6); color: #fff; font-size: 1.4rem; line-height: 40px; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <span class="ttl">令和8年度 夏休みファミリー旅行 しおり</span>
    <span class="count" id="count">1 / 10</span>
  </header>

  <div class="deck" id="deck"></div>

  <div class="hint" id="hint">← 横にスワイプでページ送り ／ タップで拡大 →</div>

  <div class="zoom" id="zoom">
    <button class="close" id="zclose" aria-label="閉じる">×</button>
    <img id="zimg" alt="">
  </div>

  <script>
    var TOTAL = 10;
    var deck = document.getElementById('deck');
    var count = document.getElementById('count');
    var hint = document.getElementById('hint');
    var zoom = document.getElementById('zoom');
    var zimg = document.getElementById('zimg');

    // スライド生成（先頭2枚は即読み込み、残りは遅延）
    for (var i = 1; i <= TOTAL; i++) {
      var n = String(i).padStart(2, '0');
      var slide = document.createElement('div');
      slide.className = 'slide';
      var img = document.createElement('img');
      img.src = 'pages/p' + n + '.jpg';
      img.alt = (i) + 'ページ';
      img.loading = (i <= 2) ? 'eager' : 'lazy';
      img.dataset.page = i;
      img.addEventListener('click', openZoom);
      slide.appendChild(img);
      deck.appendChild(slide);
    }

    // 現在ページ表示
    var ticking = false;
    deck.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var idx = Math.round(deck.scrollLeft / deck.clientWidth) + 1;
        if (idx < 1) idx = 1; if (idx > TOTAL) idx = TOTAL;
        count.textContent = idx + ' / ' + TOTAL;
        ticking = false;
      });
      if (hint) { hint.style.opacity = '0'; }
    });
    setTimeout(function () { if (hint) hint.style.opacity = '0'; }, 4000);

    function openZoom(e) {
      var src = e.currentTarget.getAttribute('src');
      var p = e.currentTarget.dataset.page;
      zimg.src = src;
      zimg.alt = p + 'ページ（拡大）';
      zoom.classList.add('open');
      zoom.scrollTop = 0;
    }
    function closeZoom() { zoom.classList.remove('open'); zimg.removeAttribute('src'); }
    document.getElementById('zclose').addEventListener('click', closeZoom);
    zimg.addEventListener('click', closeZoom);
    // 端末の戻る操作で拡大を閉じる
    window.addEventListener('popstate', function () { if (zoom.classList.contains('open')) closeZoom(); });
  </script>
</body>
</html>
